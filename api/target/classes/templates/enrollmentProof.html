<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 50px;
        color: #333;
        font-size: 14px;
    }

    .cabecalho {
        text-align: center;
        border-bottom: 2px solid #263150;
        padding-bottom: 20px;
        margin-bottom: 40px;
    }

    .cabecalho h1 {
        font-size: 26px;
        margin: 0;
        color: #263150;
    }

    .cabecalho p {
        font-size: 16px;
        margin: 5px 0 0 0;
        color: #555;
    }

    .dados {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 25px;
        background-color: #f9f9f9;
    }

    .linha {
        margin-bottom: 15px;
    }

    .linha strong {
        width: 180px;
        display: inline-block;
        color: #222;
    }

    .rodape {
        margin-top: 50px;
        font-size: 12px;
        color: #777;
        border-top: 1px dashed #ccc;
        padding-top: 15px;
    }

    .assinatura {
        margin-top: 80px;
        text-align: right;
    }

    .assinatura p {
        margin-bottom: 60px;
    }

    .assinatura .nome {
        font-weight: bold;
        text-decoration: underline;
    }
  </style>
</head>
