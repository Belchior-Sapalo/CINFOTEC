<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Certificado</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        text-align: center;
      }
      .certificate {
        border: 2px solid #000;
        padding: 20px;
        margin: 20px;
      }
      .title {
        font-size: 24px;
        margin-bottom: 20px;
      }
      .content {
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="certificate">
      <div class="title">Certificado de Conclusão</div>
      <div class="content">
        <p>
          Certificamos que
          <strong th:text="${studentName}">Nome do Aluno</strong>
        </p>
        <p>
          concluiu com êxito o curso de
          <strong th:text="${courseName}">Nome do Curso</strong>
        </p>
        <p>com carga horária de <span th:text="${duration}">XX</span> horas.</p>
        <p>Data: <span th:text="${completionDate}">DD/MM/YYYY</span></p>
      </div>
    </div>
  </body>
</html>
